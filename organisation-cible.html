  <script>
    (function () {
      var STRINGS = {
        fr: {
          "badge": "Document interne",
          "title": "Organisation cible",
          "lede": "Pour quel type de structure le modèle économique de Tanoa est-il optimisé ?",
          "refs": "Complète <a href=\"modele-economique.html\">modèle économique</a> · <a href=\"principes-fondateurs.html\">principes fondateurs</a> · <a href=\"index.html\">feuille de route</a> (rôles binôme).",
          "core.kicker": "Idée centrale",
          "core.title": "Rendement du capital, pas volume de jours",
          "core.p1": "Tanoa n’est pas optimisé pour maximiser le chiffre d’affaires ou le nombre de jours vendus. Il cherche à maximiser le rendement d’un capital intellectuel — la Forge — dont la valeur augmente au fil des missions.",
          "core.p2": "L’objectif est d’accroître la <strong>valeur produite par chaque jour travaillé</strong>, plutôt que d’augmenter le volume de travail vendu.",
          "size.kicker": "Taille",
          "size.title": "Une très petite équipe",
          "size.body": "Le modèle est idéal pour une structure de 1 à 5 personnes. Au-delà, les coûts de coordination, de recrutement et de transmission du patrimoine logiciel augmentent, tandis que le rendement marginal de la Forge risque de diminuer.",
          "size.note": "Le plafond économique par personne (niveau de vie comparable à un CDI senior protégé) peut arriver avant le plafond organisationnel à 5 — la taille n’est pas le seul limiteur.",
          "prof.kicker": "Profils",
          "prof.title": "Des profils expérimentés",
          "prof.body": "La Forge profite surtout à des développeurs seniors capables de comprendre rapidement un métier, de réutiliser intelligemment les briques existantes, et de décider quand il vaut mieux ne pas les utiliser.",
          "flat.kicker": "Forme",
          "flat.title": "Une organisation très plate",
          "flat.body": "La valeur réside dans le patrimoine logiciel et l’expertise, plus que dans le management. Le modèle s’accorde avec une structure d’associés ou d’experts travaillant directement avec les clients, avec très peu de niveaux hiérarchiques.",
          "port.kicker": "Portefeuille",
          "port.title": "Une logique de portefeuille",
          "port.body": "Contrairement à une ESN qui cherche à vendre le maximum de capacité, Tanoa sélectionne les projets qui correspondent le mieux à son patrimoine. La croissance vient de la qualité du portefeuille de missions, davantage que du volume d’affaires.",
          "com.kicker": "Commercial",
          "com.title": "Une fonction commerciale d’expertise",
          "com.p1": "Le commercial est une fonction d’expertise plus qu’une fonction de vente volume. Chaque personne en contact opportunité doit qualifier le fit Forge, participer au cadrage des forfaits et protéger le modèle économique (prix, digue, hors modèle).",
          "com.p2": "La Forge accélère le <strong>delivery</strong>, pas la prospection ni les cycles de vente. Un filtre d’entrée strict + un coefficient élevé (moins de j·h / lot) <strong>augmentent</strong> le besoin de débit commercial : chaque tech « consomme » plus de lots signés par an.",
          "com.p3": "Le ratio sain n’est donc <strong>pas</strong> « 1 commercial ESN pour 3–4 tech ». C’est plutôt : <strong>capacité de qualification ≈ capacité de delivery</strong> (~1:1 en têtes ou en temps). « Commercial » = seniors qui savent filtrer et cadrer — y compris hybrides avant-vente / delivery — pas des vendeurs volume en nombre égal aux tech.",
          "com.p4": "En Phase 0, ce rôle est souvent incarné par un associé (binôme Commercial &amp; cadre). Ce n’est pas une force de vente légère : c’est le goulot à dimensionner en premier.",
          "ratio.kicker": "Ratios",
          "ratio.title": "Effectif 1 à 5 — com / tech",
          "ratio.intro": "Ordres de grandeur en <strong>croisière</strong>. « Com » = capacité fit + cadrage + closing (poste dédié ou temps d’associé / hybride).",
          "ratio.th.n": "Effectif",
          "ratio.th.com": "Com / cadre",
          "ratio.th.tech": "Technique",
          "ratio.th.read": "Lecture",
          "ratio.1.com": "1 (même personne)",
          "ratio.1.tech": "1 (même personne)",
          "ratio.1.read": "Solo : ratio 1:1 dans le temps (~com/fit + build)",
          "ratio.2.read": "Binôme cible Phase 0 — vrai 1:1",
          "ratio.3.read": "Éviter 1 com + 2 tech purs si le coef est élevé ; préférer un hybride",
          "ratio.4.read": "Cible saine : 2 capacités fit pour 2 delivery",
          "ratio.5.read": "Plafond crédible : ~2 com/fit + ~3 tech — encore tendu",
          "ratio.5bad.read": "Fragile — com saturé, trous ou pression hors-fit",
          "ratio.note1": "À 5 personnes, 1 seul commercial d’expertise est en général trop juste.",
          "ratio.note2": "Recruter un tech de plus sans hausser la capacité à qualifier, c’est construire une usine qu’on ne peut pas nourrir.",
          "ratio.note3": "Phase 0 : rester sur la ligne 1 ou 2. Ne pas embaucher la ligne 4 « pour grandir ».",
          "role.kicker": "Profil com",
          "role.title": "Le profil recherché",
          "role.p1": "Le commercial idéal ne ressemble pas à un commercial ESN orienté volume. Il agit davantage comme un architecte d’opportunités ou un consultant avant-vente senior :",
          "role.l1": "comprendre les métiers clients ;",
          "role.l2": "connaître en profondeur ce que la Forge permet (et ne permet pas) ;",
          "role.l3": "qualifier le fit et savoir dire non ;",
          "role.l4": "cadrer économiquement les forfaits (cible, plancher, digue).",
          "role.close": "Son succès se juge sur la qualité et la rentabilité du portefeuille constitué — pas sur le seul montant des contrats signés.",
          "grow.kicker": "Croissance",
          "grow.title": "Croissance tirée par la demande qualifiée",
          "grow.p1": "Ne pas recruter des développeurs en espérant les occuper ensuite. Recruter de la capacité delivery seulement lorsque le portefeuille d’opportunités compatibles — et le débit com/fit — le justifient.",
          "grow.p2": "Si le coefficient Forge monte, il faut souvent plus de wins par tech : renforcer d’abord la qualification, pas seulement la prod.",
          "grow.p3": "Attention au démarrage : cette doctrine suppose un flux d’opportunités. Elle ne dispense pas de créer et d’entretenir ce flux. Attendre la demande sans machine commerciale, c’est confondre croisière et Phase 0.",
          "pace.kicker": "Rythme",
          "pace.title": "Un rythme volontairement maîtrisé",
          "pace.body": "Le modèle accepte qu’une partie du temps ne soit pas directement facturée si ce temps enrichit la Forge. Les périodes d’investissement sont un levier de valeur future — pas du « temps perdu » à maximiser en TJM. La productivité peut aussi se convertir en marge et en temps libre, pas automatiquement en tête tech supplémentaire.",
          "sum.kicker": "Synthèse",
          "sum.title": "Atelier d’artisans industrialisé",
          "sum.body": "La meilleure image de Tanoa est celle d’un <strong>atelier d’artisans hautement industrialisé</strong> : qualités d’une petite équipe d’experts, gains de productivité d’une plateforme logicielle.",
          "sum.quote": "Sa singularité tient autant à la Forge qu’à l’organisation : peu de niveaux hiérarchiques ; peu de deals, mais très qualifiés ; une capacité de fit du même ordre que la capacité de delivery (~1:1) — pas une usine tech nourrie par un seul commercial ; une croissance guidée par la qualité des opportunités, sans oublier que le goulot reste souvent de <strong>faire naître</strong> et de filtrer ces opportunités.",
          "see.kicker": "Liens",
          "see.title": "Documents liés",
          "see.1": "<a href=\"modele-economique.html\">Modèle économique</a> — doctrine revenus / Forge / critique",
          "see.2": "<a href=\"principes-fondateurs.html\">Principes fondateurs</a> — exploitation / investissement",
          "see.3": "<a href=\"signaux-fit.html\">Signaux de fit</a> — filtrer les missions",
          "see.4": "<a href=\"index.html\">Feuille de route</a> — rôles binôme Phase 0",
          "foot.left": "TANOA SYSTEMS · ORGANISATION CIBLE",
          "foot.right": "USAGE INTERNE · NON PUBLIC"
        },
        en: {
          "badge": "Internal document",
          "title": "Target organisation",
          "lede": "What kind of structure is Tanoa’s economic model optimised for?",
          "refs": "Complements <a href=\"modele-economique.html\">economic model</a> · <a href=\"principes-fondateurs.html\">founding principles</a> · <a href=\"index.html\">roadmap</a> (pair roles).",
          "core.kicker": "Core idea",
          "core.title": "Return on capital, not billable volume",
          "core.p1": "Tanoa is not optimised to maximise revenue or days sold. It aims to maximise return on an intellectual capital asset — the Forge — whose value grows across missions.",
          "core.p2": "The goal is to raise <strong>value produced per day worked</strong>, not to sell more days of work.",
          "size.kicker": "Size",
          "size.title": "A very small team",
          "size.body": "The model fits a 1–5 person structure. Beyond that, coordination, hiring, and transmitting software capital get costlier, while marginal Forge returns may fall.",
          "size.note": "Per-person economic ceilings (lifestyle comparable to protected senior employment) can hit before the organisational ceiling at 5 — size is not the only limiter.",
          "prof.kicker": "Profiles",
          "prof.title": "Experienced people",
          "prof.body": "The Forge mainly helps senior engineers who can grasp a domain quickly, reuse existing building blocks intelligently, and decide when not to use them.",
          "flat.kicker": "Shape",
          "flat.title": "A very flat organisation",
          "flat.body": "Value sits in software capital and expertise, more than in management layers. The model fits partners or experts working directly with clients, with very few hierarchy levels.",
          "port.kicker": "Portfolio",
          "port.title": "A portfolio logic",
          "port.body": "Unlike a classic IT services firm selling maximum capacity, Tanoa selects projects that best match its capital. Growth comes from portfolio quality more than deal volume.",
          "com.kicker": "Sales",
          "com.title": "An expertise-led commercial function",
          "com.p1": "Commercial work is expertise more than volume selling. Anyone touching opportunities must qualify Forge fit, help scope fixed-price lots, and protect the economic model (price, dike, out-of-model).",
          "com.p2": "The Forge speeds <strong>delivery</strong>, not prospecting or sales cycles. Strict intake filtering + a high coefficient (fewer days per lot) <strong>increase</strong> the need for commercial throughput: each engineer “consumes” more signed lots per year.",
          "com.p3": "The healthy ratio is therefore <strong>not</strong> “1 ESN seller for 3–4 engineers”. It is: <strong>qualification capacity ≈ delivery capacity</strong> (~1:1 in heads or in time). “Commercial” means seniors who can filter and frame — including pre-sales / delivery hybrids — not volume sellers matched 1:1 to engineers by job title alone.",
          "com.p4": "In Phase 0, that role is often owned by a partner (Commercial &amp; framing pair). It is not a light sales force: it is the bottleneck to size first.",
          "ratio.kicker": "Ratios",
          "ratio.title": "Headcount 1 to 5 — sales / engineering",
          "ratio.intro": "Cruise-phase orders of magnitude. “Sales” = fit + framing + closing capacity (dedicated role or partner / hybrid time).",
          "ratio.th.n": "Headcount",
          "ratio.th.com": "Sales / framing",
          "ratio.th.tech": "Engineering",
          "ratio.th.read": "Reading",
          "ratio.1.com": "1 (same person)",
          "ratio.1.tech": "1 (same person)",
          "ratio.1.read": "Solo: 1:1 in time (~fit/sales + build)",
          "ratio.2.read": "Target Phase 0 pair — true 1:1",
          "ratio.3.read": "Avoid 1 sales + 2 pure engineers if coefficient is high; prefer a hybrid",
          "ratio.4.read": "Healthy target: 2 fit capacities for 2 delivery",
          "ratio.5.read": "Credible ceiling: ~2 sales/fit + ~3 eng — still tight",
          "ratio.5bad.read": "Fragile — sales saturated, gaps or off-fit pressure",
          "ratio.note1": "At 5 people, a single expertise-led commercial is usually too thin.",
          "ratio.note2": "Hiring another engineer without raising qualification capacity builds a plant you cannot feed.",
          "ratio.note3": "Phase 0: stay on row 1 or 2. Do not hire row 4 “to grow”.",
          "role.kicker": "Sales profile",
          "role.title": "The profile we want",
          "role.p1": "The ideal commercial person is not an ESN volume seller. They act more like an opportunity architect or senior pre-sales consultant:",
          "role.l1": "understand client domains;",
          "role.l2": "know deeply what the Forge can and cannot do;",
          "role.l3": "qualify fit and say no;",
          "role.l4": "frame fixed-scope economics (target, floor, dike).",
          "role.close": "Success is judged on portfolio quality and profitability — not signed contract value alone.",
          "grow.kicker": "Growth",
          "grow.title": "Growth pulled by qualified demand",
          "grow.p1": "Do not hire developers hoping to keep them busy later. Add delivery capacity only when a Forge-compatible opportunity portfolio — and fit/sales throughput — justify it.",
          "grow.p2": "If the Forge coefficient rises, you often need more wins per engineer: strengthen qualification first, not only production.",
          "grow.p3": "At the start, beware: this doctrine assumes an opportunity flow. It does not remove the need to create and sustain that flow. Waiting for demand without a commercial machine confuses cruise phase with Phase 0.",
          "pace.kicker": "Pace",
          "pace.title": "A deliberately managed pace",
          "pace.body": "The model accepts that some time is not directly billed if it enriches the Forge. Investment periods are future-value levers — not “lost” time to maximise as day rates. Productivity can also turn into margin and free time, not automatically into another engineering hire.",
          "sum.kicker": "Summary",
          "sum.title": "An industrialised craft workshop",
          "sum.body": "The best image of Tanoa is a <strong>highly industrialised craft workshop</strong>: small-expert-team qualities, platform-level productivity gains.",
          "sum.quote": "Its singularity is as much organisational as technical: few hierarchy levels; few deals, but highly qualified; fit capacity on the same order as delivery capacity (~1:1) — not an engineering plant fed by a single seller; growth guided by opportunity quality, without forgetting that the bottleneck is often <strong>creating</strong> and filtering those opportunities.",
          "see.kicker": "Links",
          "see.title": "Related documents",

      };

      var KEY = "tanoa-orga-cible-lang";
      var TITLE = {
        fr: "Tanoa Systems — Organisation cible (interne)",
        en: "Tanoa Systems — Target organisation (internal)"
      };

      function apply(lang) {
        var dict = STRINGS[lang] || STRINGS.fr;
        document.documentElement.lang = lang;
        document.title = TITLE[lang] || TITLE.fr;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n");
          if (dict[k] != null) el.textContent = dict[k];
        });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
          var k = el.getAttribute("data-i18n-html");
          if (dict[k] != null) el.innerHTML = dict[k];
        });
        document.querySelectorAll(".lang-switch button").forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
        });
        try { localStorage.setItem(KEY, lang); } catch (e) {}
      }

      function detect() {
        try {
          var s = localStorage.getItem(KEY) || localStorage.getItem("tanoa-lang");
          if (s === "en" || s === "fr") return s;
        } catch (e) {}
        return ((navigator.language || "fr").toLowerCase().indexOf("fr") === 0) ? "fr" : "en";
      }

      document.querySelectorAll(".lang-switch button").forEach(function (btn) {
        btn.addEventListener("click", function () { apply(btn.getAttribute("data-lang")); });
      });
      apply(detect());
    })();
  </script>
