<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" id="meta-desc" content="" />
  <title>Tanoa Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c1410;
      --ink-soft: #1a2820;
      --muted: #5c6b62;
      --paper: #f0f4f1;
      --paper-deep: #e2ebe5;
      --line: rgba(12, 20, 16, 0.14);
      --lagoon: #0f7a5a;
      --lagoon-bright: #17a379;
      --lagoon-wash: rgba(15, 122, 90, 0.11);
      --max: 1120px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 1.05rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--lagoon); }

    .wrap {
      width: min(var(--max), calc(100% - 2.5rem));
      margin-inline: auto;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
      background: rgba(240, 244, 241, 0.88);
      border-bottom: 1px solid transparent;
    }
    .top.is-scrolled { border-bottom-color: var(--line); }
    .top-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.95rem 0;
    }
    .top-brand {
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .top nav {
      display: flex;
      gap: 1.5rem;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--muted);
    }
    .top nav a:hover { color: var(--ink); }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .lang-switch button {
      appearance: none;
      border: 0;
      margin: 0;
      padding: 0.45rem 0.65rem;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
      transition: background 160ms var(--ease), color 160ms var(--ease);
    }
    .lang-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }
    .lang-switch button:hover:not([aria-pressed="true"]) {
      color: var(--ink);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      padding: 0 1.15rem;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 180ms var(--ease), color 180ms var(--ease), transform 180ms var(--ease);
    }
    .btn:hover { background: var(--lagoon); border-color: var(--lagoon); color: #fff; transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      color: var(--ink);
    }
    .btn-ghost:hover { background: var(--ink); color: #fff; }

    .hero {
      position: relative;
      padding: 4.5rem 0 5rem;
      isolation: isolate;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0 -50vw;
      z-index: -1;
      background:
        radial-gradient(ellipse 70% 60% at 85% 20%, var(--lagoon-wash), transparent 65%),
        radial-gradient(ellipse 50% 45% at 10% 80%, rgba(15, 122, 90, 0.06), transparent 60%);
    }
    .hero-copy {
      max-width: 36rem;
      animation: rise 0.8s var(--ease) both;
    }
    .hero-brand {
      margin: 0 0 1.25rem;
      font-family: "Fraunces", serif;
      font-weight: 800;
      font-size: clamp(3.4rem, 9.5vw, 6.4rem);
      line-height: 0.92;
      letter-spacing: -0.045em;
    }
    .hero-brand span {
      display: block;
      color: var(--lagoon);
    }
    .hero-line {
      margin: 0 0 1.5rem;
      font-size: clamp(1.25rem, 2.4vw, 1.55rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.02em;
      max-width: 28rem;
    }
    .hero-support {
      margin: 0 0 1.75rem;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 26rem;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }

    section { padding: 5.5rem 0; }
    .kicker {
      margin: 0 0 0.85rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lagoon);
    }
    .section-title {
      margin: 0 0 2.5rem;
      max-width: 18ch;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: clamp(2.1rem, 4.5vw, 3.35rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .deliver-list { border-top: 1px solid var(--line); }
    .deliver-row {
      display: grid;
      grid-template-columns: 4.5rem 1fr;
      gap: 1.25rem;
      padding: 1.6rem 0;
      border-bottom: 1px solid var(--line);
    }
    .deliver-row .n {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--lagoon);
      padding-top: 0.35rem;
    }
    .deliver-row h3 {
      margin: 0 0 0.4rem;
      font-family: "Fraunces", serif;
      font-size: clamp(1.45rem, 2.5vw, 1.85rem);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .deliver-row p {
      margin: 0;
      color: var(--muted);
      max-width: 40rem;
    }

    .fit {
      background: var(--ink);
      color: #e8efea;
      padding: 5rem 0;
    }
    .fit .kicker { color: var(--lagoon-bright); }
    .fit .section-title { color: #fff; max-width: 16ch; }
    .fit-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 3rem;
      align-items: start;
    }
    .fit-list { margin: 0; padding: 0; list-style: none; }
    .fit-list li {
      padding: 1.15rem 0;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(232, 239, 234, 0.72);
      font-size: 1.05rem;
    }
    .fit-list li:last-child { border-bottom: 1px solid rgba(255, 255, 255, 0.14); }
    .fit-list strong { color: #fff; font-weight: 600; }

    .proof-intro {
      margin: -1.25rem 0 2.5rem;
      max-width: 36rem;
      color: var(--muted);
    }
    .proof-list { display: grid; gap: 0; border-top: 1px solid var(--line); }
    .proof-item {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr) auto;
      gap: 1.5rem;
      align-items: center;
      padding: 1.75rem 0;
      border-bottom: 1px solid var(--line);
      transition: background 200ms var(--ease);
    }
    .proof-item:hover { background: var(--lagoon-wash); }
    .proof-item h3 {
      margin: 0 0 0.35rem;
      font-family: "Fraunces", serif;
      font-size: 1.55rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .proof-item p { margin: 0; color: var(--muted); font-size: 0.98rem; }
    .proof-meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .proof-link {
      font-weight: 600;
      color: var(--lagoon);
      white-space: nowrap;
    }
    .proof-link span { display: inline-block; transition: transform 180ms var(--ease); }
    .proof-item:hover .proof-link span { transform: translateX(4px); }

    .socle {
      margin-top: 3rem;
      padding: 1.75rem 0 0;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.5rem;
      align-items: end;
    }
    .socle p {
      margin: 0;
      max-width: 36rem;
      color: var(--muted);
    }
    .socle strong { color: var(--ink); font-weight: 600; }

    .manifesto {
      text-align: left;
      padding: 6rem 0;
      border-top: 1px solid var(--line);
    }
    .manifesto blockquote {
      margin: 0;
      max-width: 18ch;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    .manifesto p {
      margin: 1.5rem 0 0;
      max-width: 32rem;
      color: var(--muted);
    }

    .contact-band {
      background: var(--lagoon);
      color: #fff;
      padding: 4rem 0;
    }
    .contact-band h2 {
      margin: 0 0 1rem;
      max-width: 14ch;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }
    .contact-band p {
      margin: 0 0 1.75rem;
      max-width: 28rem;
      opacity: 0.9;
    }
    .contact-band .btn {
      background: var(--ink);
      border-color: var(--ink);
    }
    .contact-band .btn:hover {
      background: #fff;
      border-color: #fff;
      color: var(--ink);
    }

    footer {
      padding: 1.75rem 0 2.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.88rem;
    }
    footer .mono {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.8rem;
    }

    @media (max-width: 880px) {
      .top nav { display: none; }
      .hero { padding: 3rem 0 3.5rem; }
      .fit-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .proof-item {
        grid-template-columns: 1fr;
        gap: 0.65rem;
      }
      .socle { grid-template-columns: 1fr; }
      .deliver-row { grid-template-columns: 3rem 1fr; }
    }
  </style>
</head>

    <section class="fit" id="method">

    <section id="proof">

      </div>

    <section class="manifesto wrap">

      <p data-i18n="manifesto.body"></p>

    <section class="contact-band" id="contact">

    </section>
  </main>

          "contact.body": "Describe the outcome you need. We’ll tell you how to slice it and deliver it fixed-scope.",
          "footer": "fixed scope · platforms & integrations · technical foundation"
        }
      };

      var STORAGE_KEY = "tanoa-lang";

      function applyLang(lang) {
        var dict = STRINGS[lang] || STRINGS.fr;
        document.documentElement.lang = lang;

        var meta = document.getElementById("meta-desc");
        if (meta) meta.setAttribute("content", dict["meta.desc"]);

        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (dict[key] != null) el.textContent = dict[key];
        });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-html");
          if (dict[key] != null) el.innerHTML = dict[key];
        });

        document.querySelectorAll(".lang-switch button").forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
        });

        try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
        try {
          history.replaceState(null, "", lang === "en" ? "#en" : "#fr");
        } catch (e) {}
      }

      function detectLang() {
        var hash = (location.hash || "").replace("#", "").toLowerCase();
        if (hash === "en" || hash === "fr") return hash;
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          if (stored === "en" || stored === "fr") return stored;
        } catch (e) {}
        var nav = (navigator.language || "fr").toLowerCase();
        return nav.indexOf("fr") === 0 ? "fr" : "en";
      }

      document.querySelectorAll(".lang-switch button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyLang(btn.getAttribute("data-lang"));
        });
      });

      applyLang(detectLang());

      var top = document.getElementById("site-top");
      if (top) {
        var onScroll = function () {
          top.classList.toggle("is-scrolled", window.scrollY > 8);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
      }
    })();
  </script>
</body>
</html>
