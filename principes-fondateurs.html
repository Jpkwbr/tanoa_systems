<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tanoa Systems — Principes fondateurs (interne)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c1410;
      --muted: #5c6b62;
      --paper: #f0f4f1;
      --paper-deep: #e2ebe5;
      --line: rgba(12, 20, 16, 0.14);
      --lagoon: #0f7a5a;
      --lagoon-bright: #17a379;
      --lagoon-wash: rgba(15, 122, 90, 0.11);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #d8e0db;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 1.05rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--lagoon); font-weight: 600; text-decoration: none; }

    .page {
      width: min(52rem, calc(100% - 2rem));
      margin: 1.25rem auto 2.5rem;
      padding: 2rem 2.25rem 2.5rem;
      background: var(--paper);
      box-shadow: 0 12px 40px rgba(12, 20, 16, 0.12);
      position: relative;
      overflow: hidden;
    }
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 40% at 100% 0%, var(--lagoon-wash), transparent 55%);
      pointer-events: none;
    }
    .page > * { position: relative; z-index: 1; }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-family: "Fraunces", serif;
      font-weight: 800;
      font-size: 1.45rem;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand span { color: var(--lagoon); }
    .top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.45rem;
    }
    .badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--ink);
      padding: 0.35rem 0.55rem;
    }
    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--line);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
    }
    .lang-switch button {
      appearance: none;
      border: 0;
      margin: 0;
      padding: 0.3rem 0.5rem;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.85rem;
      letter-spacing: -0.025em;
      line-height: 1.15;
    }
    .lede {
      margin: 0 0 1.75rem;
      color: var(--muted);
      max-width: 36rem;
    }

    .kicker {
      margin: 0 0 0.35rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lagoon);
    }
    h2 {
      margin: 0 0 0.65rem;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }
    h3 {
      margin: 0 0 0.45rem;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.02rem;
    }

    section {
      margin: 0 0 1.6rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--line);
    }
    section > p { margin: 0 0 0.75rem; }
    section > p:last-child { margin-bottom: 0; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin: 0.75rem 0;
    }
    .card {
      background: var(--paper-deep);
      padding: 0.85rem 0.95rem;
      border-top: 3px solid var(--lagoon);
    }
    .card ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .card li {
      position: relative;
      padding: 0.28rem 0 0.28rem 0.85rem;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .card li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.75em;
      width: 0.4rem;
      height: 2px;
      background: var(--lagoon);
    }

    .assets {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .assets li {
      padding: 0.45rem 0;
      border-top: 1px solid var(--line);
      font-size: 0.95rem;
    }
    .assets li:first-child { border-top: 0; padding-top: 0; }
    .assets strong {
      display: block;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 0.98rem;
      margin-bottom: 0.1rem;
    }
    .assets span { color: var(--muted); font-size: 0.9rem; }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin: 0.75rem 0;
    }
    .split article {
      padding: 0.85rem 0.95rem;
      background: #fff;
      border: 1px solid var(--line);
    }
    .split p { margin: 0; color: var(--muted); font-size: 0.92rem; }

    .outcomes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin: 0.75rem 0 0;
      padding: 0;
    }
    .outcomes li {
      list-style: none;
      background: var(--ink);
      color: rgba(232, 239, 234, 0.88);
      padding: 0.7rem 0.65rem;
      font-size: 0.82rem;
      text-align: center;
    }
    .outcomes strong {
      display: block;
      color: #fff;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 0.95rem;
      margin-bottom: 0.15rem;
    }

    .question {
      margin: 1rem 0 0;
      padding: 0.95rem 1rem;
      background: var(--ink);
      color: rgba(232, 239, 234, 0.88);
    }
    .question .kicker { color: var(--lagoon-bright); }
    .question p {
      margin: 0;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.05rem;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }
    .question .note {
      margin: 0.55rem 0 0;
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 400;
      font-size: 0.85rem;
      color: rgba(232, 239, 234, 0.72);
    }

    .foot {
      margin-top: 1.75rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--line);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    @media (max-width: 720px) {
      .page { padding: 1.35rem 1.15rem 1.75rem; }
      .grid-2, .split, .outcomes { grid-template-columns: 1fr; }
      .top-right { align-items: flex-start; }
    }

    @media print {
      body { background: #fff; }
      .page { box-shadow: none; margin: 0; width: 100%; }
      .lang-switch { display: none !important; }
      .badge { color: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>

      function apply(lang) {
        var dict = STRINGS[lang] || STRINGS.fr;
        document.documentElement.lang = lang;
        document.title = TITLE[lang] || TITLE.fr;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n");
          if (dict[k] != null) el.textContent = dict[k];
        });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
          var k = el.getAttribute("data-i18n-html");
          if (dict[k] != null) el.innerHTML = dict[k];
        });
        document.querySelectorAll(".lang-switch button").forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
        });
        try { localStorage.setItem(KEY, lang); } catch (e) {}
      }

      function detect() {
        try {
          var s = localStorage.getItem(KEY) || localStorage.getItem("tanoa-lang");
          if (s === "en" || s === "fr") return s;
        } catch (e) {}
        return ((navigator.language || "fr").toLowerCase().indexOf("fr") === 0) ? "fr" : "en";
      }

      document.querySelectorAll(".lang-switch button").forEach(function (btn) {
        btn.addEventListener("click", function () { apply(btn.getAttribute("data-lang")); });
      });
      apply(detect());
    })();
  </script>
</body>
</html>
