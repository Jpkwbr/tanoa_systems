<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tanoa Systems — Fiche offre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c1410;
      --muted: #5c6b62;
      --paper: #f0f4f1;
      --line: rgba(12, 20, 16, 0.14);
      --lagoon: #0f7a5a;
      --lagoon-wash: rgba(15, 122, 90, 0.11);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #d8e0db;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 10.5pt;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--lagoon); text-decoration: none; font-weight: 600; }

    .sheet {
      width: min(210mm, calc(100% - 1.5rem));
      min-height: 297mm;
      margin: 1rem auto;
      padding: 14mm 14mm 12mm;
      background: var(--paper);
      box-shadow: 0 12px 40px rgba(12, 20, 16, 0.12);
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      overflow: hidden;
    }
    .sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 40% at 100% 0%, var(--lagoon-wash), transparent 55%);
      pointer-events: none;
    }
    .sheet > * { position: relative; z-index: 1; }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.35rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-family: "Fraunces", serif;
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .brand span { color: var(--lagoon); }
    .top-meta {
      text-align: right;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .lang-switch {
      display: inline-flex;
      margin-top: 0.45rem;
      border: 1px solid var(--line);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
    }
    .lang-switch button {
      appearance: none;
      border: 0;
      margin: 0;
      padding: 0.3rem 0.5rem;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    .hero-line {
      margin: 0 0 0.55rem;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.55rem;
      line-height: 1.15;
      letter-spacing: -0.025em;
      max-width: 28ch;
    }
    .hero-support {
      margin: 0 0 1.25rem;
      color: var(--muted);
      max-width: 52ch;
      font-size: 0.95rem;
    }
    .hero-support .name { color: var(--ink); font-weight: 650; }
    .hero-support .name span { color: var(--lagoon); }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 1.1rem 1.4rem;
      flex: 1;
    }

    .kicker {
      margin: 0 0 0.35rem;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--lagoon);
    }
    h2 {
      margin: 0 0 0.55rem;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .block {
      padding: 0.75rem 0 0.9rem;
      border-top: 1px solid var(--line);
    }

    .deliveries { margin: 0; padding: 0; list-style: none; }
    .deliveries li {
      display: grid;
      grid-template-columns: 1.6rem 1fr;
      gap: 0.45rem;
      padding: 0.4rem 0;
    }
    .deliveries li + li { border-top: 1px solid var(--line); }
    .deliveries .n {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      color: var(--lagoon);
      padding-top: 0.15rem;
    }
    .deliveries strong {
      display: block;
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 0.95rem;
      margin-bottom: 0.1rem;
    }
    .deliveries p {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .fit {
      background: var(--ink);
      color: rgba(232, 239, 234, 0.78);
      padding: 0.85rem 0.95rem;
      margin-top: 0.15rem;
    }
    .fit .kicker { color: #17a379; }
    .fit h2 { color: #fff; }
    .fit ul { margin: 0; padding: 0; list-style: none; }
    .fit li {
      padding: 0.35rem 0;
      border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 0.82rem;
    }
    .fit li:first-child { border-top: 0; padding-top: 0; }
    .fit strong { color: #fff; font-weight: 600; }

    .proof p { margin: 0 0 0.45rem; color: var(--muted); font-size: 0.82rem; }
    .proof p:last-child { margin-bottom: 0; }
    .proof strong { color: var(--ink); }

    .audience ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .audience li {
      padding: 0.28rem 0;
      color: var(--muted);
      font-size: 0.85rem;
      padding-left: 0.85rem;
      position: relative;
    }
    .audience li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.7em;
      width: 0.4rem;
      height: 2px;
      background: var(--lagoon);
    }

    .foot {
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 1rem;
    }
    .foot-cta {
      font-family: "Fraunces", serif;
      font-weight: 650;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }
    .foot-cta p {
      margin: 0.25rem 0 0;
      font-family: "IBM Plex Sans", sans-serif;
      font-weight: 400;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .foot-mail {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .screen-hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin: 0.75rem auto 1.5rem;
      max-width: 40rem;
    }

    @media print {
      body { background: #fff; }
      .sheet {
        width: 210mm;
        min-height: 297mm;
        margin: 0;
        padding: 12mm 14mm;
        box-shadow: none;
      }
      .lang-switch, .screen-hint { display: none !important; }
      a { color: var(--ink); }
      @page { size: A4; margin: 0; }
    }

    @media (max-width: 700px) {
      .sheet { min-height: auto; padding: 1.25rem; }
      .grid-2 { grid-template-columns: 1fr; }
      .top { flex-direction: column; }
      .top-meta { text-align: left; }
    }
  </style>
</head>
<body>
  <article class="sheet">
    <header class="top">
      <div class="brand">Tanoa <span>Systems</span></div>
      <div class="top-meta">
        <div data-i18n="doc.label"></div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="fr" aria-pressed="true">FR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <p class="hero-line" data-i18n="hero.line"></p>
    <p class="hero-support" data-i18n-html="hero.support"></p>

    <div class="grid-2">
      <div>
        <section class="block">
          <p class="kicker" data-i18n="who.kicker"></p>
          <h2 data-i18n="who.title"></h2>
          <div class="audience">
            <ul>
              <li data-i18n="who.1"></li>
              <li data-i18n="who.2"></li>
              <li data-i18n="who.3"></li>
            </ul>
          </div>
        </section>

        <section class="block">
          <p class="kicker" data-i18n="work.kicker"></p>
          <h2 data-i18n="work.title"></h2>
          <ul class="deliveries">
            <li>
              <span class="n">01</span>
              <div>
                <strong data-i18n="work.1.title"></strong>
                <p data-i18n="work.1.body"></p>
              </div>
            </li>
            <li>
              <span class="n">02</span>
              <div>
                <strong data-i18n="work.2.title"></strong>
                <p data-i18n="work.2.body"></p>
              </div>
            </li>
            <li>
              <span class="n">03</span>
              <div>
                <strong data-i18n="work.3.title"></strong>
                <p data-i18n="work.3.body"></p>
              </div>
            </li>
          </ul>
        </section>
      </div>

      <div>
        <section class="block" style="border-top: 0; padding-top: 0;">
          <div class="fit">
            <p class="kicker" data-i18n="fit.kicker"></p>
            <h2 data-i18n="fit.title"></h2>
            <ul>
              <li data-i18n-html="fit.1"></li>
              <li data-i18n-html="fit.2"></li>
              <li data-i18n-html="fit.3"></li>
              <li data-i18n-html="fit.4"></li>
            </ul>
          </div>
        </section>

        <section class="block proof">
          <p class="kicker" data-i18n="proof.kicker"></p>
          <h2 data-i18n="proof.title"></h2>
          <p data-i18n-html="proof.body"></p>
          <p>
            <a href="https://kontiki-org.github.io/" target="_blank" rel="noreferrer">kontiki-org.github.io</a>
            ·
            <a href="https://github.com/kontiki-org/boomerang" target="_blank" rel="noreferrer">Boomerang</a>
          </p>
        </section>
      </div>
    </div>

    <footer class="foot">
      <div class="foot-cta">
        <span data-i18n="cta.title"></span>
        <p data-i18n="cta.body"></p>
      </div>
      <a class="foot-mail" href="mailto:hello@tanoa.systems">hello@tanoa.systems</a>
    </footer>
  </article>

  <p class="screen-hint" data-i18n="hint"></p>

  <script>
    (function () {
      var STRINGS = {
        fr: {
          "doc.label": "FICHE OFFRE · FORFAIT",
          "hero.line": "Connecter vos systèmes, automatiser vos traitements, construire votre plateforme backend.",
          "hero.support": "<span class=\"name\">Tanoa <span>Systems</span></span> réalise des systèmes distribués au forfait, en s’appuyant sur un socle open source qui accélère la livraison — le client paie le livrable, pas le framework.",
          "who.kicker": "Votre situation",
          "who.title": "Vous vous reconnaissez si…",
          "who.1": "Plusieurs applications doivent échanger des données ou des événements.",
          "who.2": "Vous devez construire ou renforcer une plateforme backend ciblée.",
          "who.3": "Le besoin est identifiable : une brique ou une petite plateforme, avec un résultat à cadrer.",
          "work.kicker": "Ce que nous livrons",
          "work.title": "Le résultat dont vous avez besoin.",
          "work.1.title": "Services distribués",
          "work.1.body": "Briques autonomes prêtes à exploiter : événements, RPC, APIs, persistance, tests.",
          "work.2.title": "Intégrations",
          "work.2.body": "Connecteurs et flux entre applications : normalisation, reprises, orchestration.",
          "work.3.title": "Plateformes ciblées",
          "work.3.body": "Bus événementiel, traitements asynchrones, orchestration — documentés et mis en route.",
          "fit.kicker": "Façon de travailler",
          "fit.title": "Concevoir et livrer, au forfait.",
          "fit.1": "Ceux qui <strong>conçoivent</strong> le système sont ceux qui le <strong>développent</strong>.",
          "fit.2": "Travail au <strong>forfait</strong>, sur un périmètre clairement défini.",
          "fit.3": "Livraison <strong>progressive</strong>, avec critères d’acceptation explicites.",
          "fit.4": "Relation <strong>directe</strong> avec les décideurs techniques.",
          "proof.kicker": "Notre levier",
          "proof.title": "Chaque projet part d’un socle existant.",
          "proof.body": "Chaque mission bénéficie d’un patrimoine open source — livraison plus rapide, moins de code spécifique. <strong>Kontiki</strong> en est la preuve concrète.",
          "cta.title": "Parlons de votre prochain système.",
          "cta.body": "Décrivez votre besoin — nous dirons comment le cadrer et le livrer.",
          "hint": "Astuce : Fichier → Imprimer → « Enregistrer au format PDF » pour une fiche A4."
        },
        en: {
          "doc.label": "OFFER ONE-PAGER · FIXED SCOPE",
          "hero.line": "Connect your systems, automate your workloads, build your backend platform.",
          "hero.support": "<span class=\"name\">Tanoa <span>Systems</span></span> delivers fixed-scope distributed systems, backed by an open-source foundation that speeds up delivery — the client pays for the deliverable, not the framework.",
          "who.kicker": "Your situation",
          "who.title": "This is for you if…",
          "who.1": "Several applications need to exchange data or events.",
          "who.2": "You need to build or strengthen a focused backend platform.",
          "who.3": "The need is identifiable: a building block or small platform, with a framed outcome.",
          "work.kicker": "What we deliver",
          "work.title": "The outcome you need.",
          "work.1.title": "Distributed services",
          "work.1.body": "Autonomous building blocks ready to run: events, RPC, APIs, persistence, tests.",
          "work.2.title": "Integrations",
          "work.2.body": "Connectors and flows across applications: normalisation, retries, orchestration.",
          "work.3.title": "Focused platforms",
          "work.3.body": "Event bus, async processing, orchestration — documented and brought online.",
          "fit.kicker": "How we work",
          "fit.title": "Design and deliver, fixed-scope.",
          "fit.1": "The people who <strong>design</strong> the system are the ones who <strong>build</strong> it.",
          "fit.2": "<strong>Fixed-scope</strong> work, on a clearly defined perimeter.",
          "fit.3": "<strong>Incremental</strong> delivery, with explicit acceptance criteria.",
          "fit.4": "<strong>Direct</strong> relationship with technical decision-makers.",
          "proof.kicker": "Our leverage",
          "proof.title": "Every project starts from existing capital.",
          "proof.body": "Every engagement builds on open-source capital — faster delivery, less bespoke code. <strong>Kontiki</strong> is the concrete proof.",
          "cta.title": "Let’s talk about your next system.",
          "cta.body": "Describe the need — we’ll say how to frame it and deliver it.",
          "hint": "Tip: File → Print → “Save as PDF” for a clean A4 one-pager."
        }
      };

      var KEY = "tanoa-offer-lang";

      function apply(lang) {
        var dict = STRINGS[lang] || STRINGS.fr;
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var k = el.getAttribute("data-i18n");
          if (dict[k] != null) el.textContent = dict[k];
        });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
          var k = el.getAttribute("data-i18n-html");
          if (dict[k] != null) el.innerHTML = dict[k];
        });
        document.querySelectorAll(".lang-switch button").forEach(function (btn) {
          btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
        });
        try { localStorage.setItem(KEY, lang); } catch (e) {}
      }

      function detect() {
        try {
          var s = localStorage.getItem(KEY) || localStorage.getItem("tanoa-lang");
          if (s === "en" || s === "fr") return s;
        } catch (e) {}
        return ((navigator.language || "fr").toLowerCase().indexOf("fr") === 0) ? "fr" : "en";
      }

      document.querySelectorAll(".lang-switch button").forEach(function (btn) {
        btn.addEventListener("click", function () { apply(btn.getAttribute("data-lang")); });
      });
      apply(detect());
    })();
  </script>
</body>
</html>
